#                      port: metrics
#                prometheusRule:
#                    enabled: false
#                targetSelector: metrics
#                type: servicemonitor
        persistence:
            config:
                enabled: true
                readOnly: false
                storageClass: ""
                targetSelector:
#                    exportarr:
#                        exportarr:
#                            mountPath: /config
#                            readOnly: true
                    main:
                        main:
                            mountPath: /config
                volsync:
                    - credentials: aws
                      type: restic
                      name: sonarr-config
                      src:
                        enabled: true
                      dest:
                        enabled: true
            data-vol:
                enabled: true
                type: nfs
                mountPath: /data
                path: /mnt/Helios/data
                server: ${LOCAL_NAS_IP}
        release_name: sonarr-v2
        securityContext:
            container:
                UMASK: "0022"
                runAsGroup: 568
                runAsUser: 568
            pod:
                fsGroupChangePolicy: OnRootMismatch
        service:
            main:
                enabled: true
                ports:
                    main:
                        port: 8989
                type: LoadBalancer
                loadBalancerIP: 10.0.0.217
