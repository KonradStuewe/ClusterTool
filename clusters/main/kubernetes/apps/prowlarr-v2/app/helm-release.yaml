apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: prowlarr-v2
    namespace: prowlarr-v2
spec:
    interval: 15m
    chart:
        spec:
            chart: prowlarr
            version: 18.14.3
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
    releaseName: prowlarr-v2
    values:
        credentials:
            aws:
                type: s3
                accessKey: ${AWS_ACCESS_KEY}
                bucket: ${AWS_BUCKET}
                encrKey: ${AWS_ENCR_KEY}
                secretKey: ${AWS_SECRET_KEY}
                url: ${AWS_URL}
        persistence:
            config:
                enabled: true
                mountPath: /config
                volsync:
                    - credentials: aws
                      type: restic
                      name: prowlarr-config
                      src:
                        enabled: false
                      dest:
                        enabled: true
        release_name: prowlarr-v2
        service:
            main:
                enabled: true
                ports:
                    main:
                        port: 9696
                type: LoadBalancer
                loadBalancerIP: 10.0.0.216
